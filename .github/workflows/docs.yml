name: Docs
on:
  workflow_call:
    inputs:
      publish:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the rendered wiki
        required: false
        default: false
        type: boolean
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Build
        run: |
          npm ci
          npm run build:docs
      - name: Archive wiki
        uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: .local/wiki
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: npm-logs
          path: ~/.npm/_logs
  publish:
    name: Publish
    needs: build
    if: inputs.publish && github.repository == 'chr33s/liquid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Restore wiki
        uses: actions/download-artifact@v7
        with:
          name: wiki
          path: .local/wiki
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/publish-wiki.mts
