name: Test
on: [workflow_dispatch, workflow_call]
jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        timezone: [Etc/GMT, Asia/Shanghai, America/New_York]
        node-version: [latest]
        include:
          - os: ubuntu-latest
            node-version: lts/*
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - name: Run Test
        run: TZ=${{ matrix.timezone || 'Etc/GMT' }} npm test
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-npm-logs-${{ matrix.os }}-${{ matrix.node-version }}
          path: ~/.npm/_logs
  spec:
    name: Acceptance (Shopify/liquid-spec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-ubuntu-latest
          path: dist
      - name: Run liquid-spec
        run: npm run test:spec -- --report liquid-spec-report.json
      - name: Archive report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liquid-spec-report
          path: liquid-spec-report.json
      - name: Differential test against the reference
        run: npm run test:diff -- --report liquid-diff-report.json
      - name: Archive differential report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liquid-diff-report
          path: liquid-diff-report.json
  demo:
    name: Demo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-ubuntu-latest
          path: dist
      - name: Run Demo Test
        run: npm run test:demo
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-npm-logs
          path: ~/.npm/_logs
